name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        description: Version tag matching CMake (run from main)
        required: true
        default: v0.1.0
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches application version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'project\(SpeedMIDIEditor VERSION ([\d.]+)', Path('CMakeLists.txt').read_text()).group(1)
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch' and os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('Manual releases must run from main')
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match the CMake application version')
          if not Path(f'docs/RELEASE_NOTES_{version}.md').is_file():
              raise SystemExit('Add release notes for this application version before releasing')
          PY
  windows:
    needs: validate
    uses: ./.github/workflows/windows-build.yml
  macos:
    needs: validate
    uses: ./.github/workflows/macos-build.yml
  draft:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Speed-MIDI-Editor-*
          path: dist
          merge-multiple: true
      - name: Create checksums and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test -f dist/Speed-MIDI-Editor-Windows-x64.zip
          test -f dist/Speed-MIDI-Editor-macOS-Universal.zip
          test -f dist/Speed-MIDI-Editor-*-Windows-x64-Setup.exe
          test -f dist/Speed-MIDI-Editor-*-macOS-Universal.pkg
          (cd dist && sha256sum *.zip *.exe *.pkg > SHA256SUMS.txt)
          # Manual runs create the immutable tag only after both builds pass.
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha); then
              test "$existing" = "$GITHUB_SHA"
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
            fi
          fi
          # Never replace assets on a published release during a rerun.
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Release is already published"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Speed MIDI Editor $RELEASE_TAG" --notes-file "docs/RELEASE_NOTES_${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" dist/*.zip dist/*.exe dist/*.pkg dist/SHA256SUMS.txt --clobber
