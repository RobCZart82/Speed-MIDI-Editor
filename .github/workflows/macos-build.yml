name: macOS Universal build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: macOS Universal 2 package
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6.11.2 Universal
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: mac
          target: desktop
          arch: clang_64
          modules: qtsvg qttools

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Deploy Qt frameworks and plugins
        run: macdeployqt "build/Speed MIDI Editor.app" -no-codesign

      - name: Verify Universal 2 executable and Qt frameworks
        run: |
          lipo -verify_arch x86_64 "build/Speed MIDI Editor.app/Contents/MacOS/Speed MIDI Editor"
          lipo -verify_arch arm64 "build/Speed MIDI Editor.app/Contents/MacOS/Speed MIDI Editor"
          lipo -verify_arch x86_64 "build/Speed MIDI Editor.app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore"
          lipo -verify_arch arm64 "build/Speed MIDI Editor.app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore"
          test -d "build/Speed MIDI Editor.app/Contents/PlugIns/platforms"
          test -f "build/Speed MIDI Editor.app/Contents/MacOS/translations/msg_en.qm"
          test -f "build/Speed MIDI Editor.app/Contents/MacOS/translations/msg_de.qm"

      - name: Package app for GitHub download
        run: |
          mkdir -p "dist/Speed MIDI Editor"
          ditto "build/Speed MIDI Editor.app" "dist/Speed MIDI Editor/Speed MIDI Editor.app"
          cp README.md LICENSE third_party/portmidi/LICENSE.PortMidi \
            docs/THIRD_PARTY_NOTICES.md docs/USER_GUIDE_EN.md docs/USER_GUIDE_HU.md \
            src/speedymidi/images/README.images "dist/Speed MIDI Editor/"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Speed MIDI Editor" \
            "dist/Speed-MIDI-Editor-macOS-Universal.zip"

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: Speed-MIDI-Editor-macOS-Universal
          path: dist/Speed-MIDI-Editor-macOS-Universal.zip
          if-no-files-found: error
          retention-days: 14
