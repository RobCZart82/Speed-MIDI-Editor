name: macOS Universal build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS Universal 2 package
    runs-on: macos-15

    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6.10.3 Universal
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          archives: qtbase qtsvg qttools

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Run regression tests
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Deploy Qt frameworks and plugins
        run: macdeployqt "build/Speed MIDI Editor.app" -codesign=-

      - name: Verify Universal 2 executable and Qt frameworks
        run: |
          lipo "build/Speed MIDI Editor.app/Contents/MacOS/Speed MIDI Editor" -verify_arch x86_64
          lipo "build/Speed MIDI Editor.app/Contents/MacOS/Speed MIDI Editor" -verify_arch arm64
          lipo "build/Speed MIDI Editor.app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore" -verify_arch x86_64
          lipo "build/Speed MIDI Editor.app/Contents/Frameworks/QtCore.framework/Versions/A/QtCore" -verify_arch arm64
          test -d "build/Speed MIDI Editor.app/Contents/PlugIns/platforms"
          test -f "build/Speed MIDI Editor.app/Contents/Resources/translations/msg_en.qm"
          test -f "build/Speed MIDI Editor.app/Contents/Resources/translations/msg_de.qm"

      - name: Package app for GitHub download
        run: |
          mkdir -p "dist/Speed MIDI Editor"
          ditto "build/Speed MIDI Editor.app" "dist/Speed MIDI Editor/Speed MIDI Editor.app"
          cp README.md LICENSE third_party/portmidi/LICENSE.PortMidi \
            docs/THIRD_PARTY_NOTICES.md docs/USER_GUIDE_EN.md docs/USER_GUIDE_HU.md \
            src/speedymidi/images/README.images "dist/Speed MIDI Editor/"
          python3 scripts/verify_package.py macos "dist/Speed MIDI Editor"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Speed MIDI Editor" \
            "dist/Speed-MIDI-Editor-macOS-Universal.zip"

      - name: Build and mount-verify DMG
        run: python3 scripts/build_installer.py macos "dist/Speed MIDI Editor" dist

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: Speed-MIDI-Editor-macOS-Universal
          path: |
            dist/Speed-MIDI-Editor-macOS-Universal.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: macOS strict sanitizers
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: mac
          target: desktop
          arch: clang_64
          archives: qtbase qtsvg qttools
      - name: Configure instrumented Debug build
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DSPEED_MIDI_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel 4
      - name: Fail on sanitizer diagnostics
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=0
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-sanitized --output-on-failure --no-tests=error
